<!DOCTYPE html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* De voortgangsbalkjes bovenin */
        .progress-container {
            display: flex;
            gap: 4px;
            padding: 15px 10px;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .progress-bar {
            flex-grow: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            background-size: cover;
            background-position: center;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* Zorgt voor een donkere laag over de foto zodat tekst leesbaar blijft */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #1DB954; /* Spotify groen */
        }

        .main-text {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .sub-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Transparante knoppen om te tikken */
        .tap-left, .tap-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 20;
            cursor: pointer;
        }
        .tap-left { left: 0; }
        .tap-right { right: 0; }

        /* Uitzondering voor video op de achtergrond */
        video.bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Knopje om de muziek aan/uit te zetten */
        .music-toggle {
            position: absolute;
            top: 35px;
            right: 12px;
            z-index: 30;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            color: white;
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .music-toggle:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        /* --- Achtergrondfoto van slide 1 --- */
        .slide-bg-crop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            background-color: #000;
        }

        /* Vage, uitvergrote kopie van de foto vult de randen,
           zodat er geen zwarte balken boven en onder ontstaan. */
        .slide-bg-crop::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('media/slide 1/eerste dd.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.45);
        }

        /* De scherpe foto. Twee knoppen om aan te draaien:
           background-size  = ZOOM (lager percentage = verder uitgezoomd)
           background-position = UITSNEDE (eerste getal: hoger = foto verder
           naar links, dus meer van de rechterkant in beeld) */
        .slide-bg-crop::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media/slide 1/eerste dd.jpg');
            background-repeat: no-repeat;
            background-size: 140% auto;
            background-position: 100% 15%;
        }

        /* Tekst onderaan de slide in plaats van in het midden */
        .slide.align-bottom {
            justify-content: flex-end;
            padding-bottom: 60px;
        }

        /* =========================================================
           HOOFDSCHERM VAN EEN CATEGORIE (de ranglijst)
           ========================================================= */
        .cat-head {
            justify-content: flex-start;
            padding-top: 70px;
        }

        .cat-head .content {
            text-align: left;
            width: 100%;
        }

        .cat-head .main-text {
            font-size: 2.1rem;
            margin-bottom: 6px;
        }

        .cat-head .sub-text {
            font-size: 1rem;
            margin-bottom: 22px;
        }

        .rank-list {
            list-style: none;
            width: 100%;
        }

        .rank-item {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .rank-nr {
            font-size: 1.35rem;
            font-weight: 900;
            color: #1DB954;
            width: 26px;

        .rank-naam {

        .rank-score {

            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
        }

        /* =========================================================
           SLIDE VAN EEN LOSSE ENTRY (de foto's)
           ========================================================= */
        .slide.entry {
            padding: 0;
            justify-content: flex-start;
        }

        /* Vage kopie van de eerste foto als achtergrondvulling */
        .entry-backdrop {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.4);
            z-index: 0;
        }

        .entry-photos {
            position: relative;
            z-index: 2;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            gap: 5px;
            padding: 55px 14px 10px;
        }

        .photo-cell {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
        }

        .photo-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Eén staande foto vult de slide, twee liggende komen onder elkaar */
        .entry-photos[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .entry-photos[data-count="2"] { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }

        .entry-info {
            position: relative;
            z-index: 2;
            flex: 0 0 auto;

            font-size: 0.85rem;

            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 10px;
            line-height: 1.35;

/* =============================================================
   VANAF HIER HOEF JE NIETS MEER AAN TE PASSEN
   ============================================================= */

const storyContainer = document.getElementById('story-container');
const outroSlide = document.getElementById('outro-slide');
const progressContainer = document.getElementById('progress-container');

// Zet spaties e.d. om zodat een pad met spaties ook werkt in CSS url()
function cssUrl(pad) {
    return "url('" + encodeURI(pad) + "')";
}

function scoreLabel(score, eenheid) {
    const getal = score.toLocaleString('nl-NL');
    return EENHEID_ACHTER_GETAL ? getal + ' ' + eenheid : eenheid + ' ' + getal;
}

// Hoogste score eerst
function gesorteerdeEntries(categorie) {
    return categorie.entries.slice().sort((a, b) => b.score - a.score);
}

function maakHoofdscherm(categorie, entries, sectie) {
    const slide = document.createElement('div');
    slide.className = 'slide cat-head';
    slide.dataset.section = sectie;

    const achtergrond = categorie.achtergrond || entries[0].fotos[0];

    const items = entries.map((entry, i) => `
                <li class="rank-item">
                    <span class="rank-nr">${i + 1}</span>
                    <span class="rank-naam">${entry.naam}</span>
                    <span class="rank-score">${scoreLabel(entry.score, categorie.eenheid)}</span>
                </li>`).join('');

    slide.innerHTML = `
        <div class="entry-backdrop" style="background-image: ${cssUrl(achtergrond)};"></div>
        <div class="overlay"></div>
        <div class="content">
            <div class="title">Top ${entries.length}</div>
            <div class="main-text">${categorie.naam}</div>
            <div class="sub-text">${categorie.ondertitel}</div>
            <ul class="rank-list">${items}</ul>
        </div>`;

    return slide;
}

function maakEntrySlide(categorie, entry, positie, sectie, groep, toonTekst) {
    const slide = document.createElement('div');
    slide.className = 'slide entry';
    slide.dataset.section = sectie;

    const cellen = groep.map(foto =>
        `<div class="photo-cell"><img src="${encodeURI(foto)}" alt="${entry.naam}" loading="lazy"></div>`
    ).join('');

    const tekst = (toonTekst && entry.tekst)
        ? `<div class="entry-tekst">${entry.tekst}</div>` : '';

    slide.innerHTML = `
        <div class="entry-backdrop" style="background-image: ${cssUrl(groep[0])};"></div>
        <div class="entry-photos" data-count="${groep.length}">${cellen}</div>
        <div class="entry-info">
            <div class="entry-rank">#${positie} &middot; ${categorie.naam}</div>
            <div class="entry-naam">${entry.naam}</div>
            <div class="entry-score">${scoreLabel(entry.score, categorie.eenheid)}</div>
            ${tekst}
        </div>`;

    return slide;
}

/* Verdeelt de foto's van één entry over slides:
   - staande (verticale) foto's krijgen elk hun eigen slide
   - liggende (horizontale) foto's gaan met z'n tweeen onder elkaar
   Er komen dus nooit meer dan 2 foto's op één slide. */
function verdeelFotos(fotos, isLiggend) {
    const liggend = fotos.filter(isLiggend);
    const staand = fotos.filter(f => !isLiggend(f));
    const groepen = [];

    for (let i = 0; i < liggend.length; i += 2) {
        groepen.push(liggend.slice(i, i + 2));
    }
    staand.forEach(foto => groepen.push([foto]));

    return groepen;
}

// Leest de echte afmetingen van een foto uit, zodat we niet hoeven te raden
// of hij staand of liggend is.
function meetFoto(pad) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve([pad, img.naturalWidth >= img.naturalHeight]);
        img.onerror = () => resolve([pad, true]); // niet gevonden: behandel als liggend
        img.src = encodeURI(pad);
    });
}

function bouwSlides(orientatie) {
    const isLiggend = foto => orientatie.get(foto) !== false;

    CATEGORIEEN.forEach((categorie, index) => {
        const sectie = 'cat-' + index;
        const entries = gesorteerdeEntries(categorie);

        storyContainer.insertBefore(maakHoofdscherm(categorie, entries, sectie), outroSlide);

        entries.forEach((entry, i) => {
            verdeelFotos(entry.fotos, isLiggend).forEach((groep, g) => {
                storyContainer.insertBefore(
                    maakEntrySlide(categorie, entry, i + 1, sectie, groep, g === 0),
                    outroSlide
                );
            });
        });
    });

    // Pas NA het bouwen alle slides opnieuw ophalen
    slides = Array.from(document.querySelectorAll('.slide'));
    updateProgress();
}

let slides = Array.from(document.querySelectorAll('.slide'));
let currentSlide = 0;

// Eerst alle foto's opmeten, daarna pas de slides bouwen
const alleFotos = CATEGORIEEN.flatMap(c => c.entries.flatMap(e => e.fotos));
Promise.all(alleFotos.map(meetFoto)).then(paren => bouwSlides(new Map(paren)));

// De balkjes tonen alleen de slides van het huidige onderdeel,
// anders worden het er veel te veel en te dun.
function updateProgress() {
    const sectie = slides[currentSlide].dataset.section;
    const sectieSlides = slides.filter(s => s.dataset.section === sectie);
    const positie = sectieSlides.indexOf(slides[currentSlide]);

    progressContainer.innerHTML = '';
    sectieSlides.forEach((_, i) => {
        const bar = document.createElement('div');
        bar.className = 'progress-bar';
        bar.innerHTML = `<div class="progress-fill" style="width: ${i <= positie ? 100 : 0}%"></div>`;
        progressContainer.appendChild(bar);
    });

    slides.forEach(slide => slide.classList.remove('active'));
    slides[currentSlide].classList.add('active');
}

function nextSlide() {
    if (currentSlide < slides.length - 1) {
        currentSlide++;
        updateProgress();
    }
}

function prevSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        updateProgress();
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
});

updateProgress();

function toggleMusic(event) {
    // Voorkomt dat de klik ook de "start bij eerste tik"-listener activeert
    if (event) event.stopPropagation();
    if (music.paused) {
        music.play().catch(() => {});
    } else {
        music.pause();
    }
}

music.addEventListener('play', syncMusicIcon);
music.addEventListener('pause', syncMusicIcon);

// Browsers blokkeren geluid tot de bezoeker iets aanraakt.
// Daarom proberen we het meteen, en anders bij de eerste tik.
function startMusic() {
    music.play().then(stopWaitingForTap).catch(() => {});
}

function stopWaitingForTap() {
    document.removeEventListener('click', startMusic);
    document.removeEventListener('keydown', startMusic);
    document.removeEventListener('touchstart', startMusic);
}

startMusic();
document.addEventListener('click', startMusic);
document.addEventListener('keydown', startMusic);
document.addEventListener('touchstart', startMusic);
</script>
